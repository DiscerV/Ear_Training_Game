<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ear Training Game</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>🎵 EAR TRAINING GAME</h1>

        <div id="top-bar-players" class="top-bar"></div>

        <div id="lobby-section" class="card-box">
            <h3>เข้าสู่เกม</h3>
            <div class="input-group">
                <input type="text" id="player-name-input" placeholder="กรอกชื่อของคุณ..." maxlength="12">
            </div>
            
            <div class="button-group">
                <button onclick="startSinglePlayer()" class="btn btn-secondary">🎮 เล่นคนเดียว (Single Player)</button>
                <button onclick="createRoom()" class="btn btn-primary">🏠 สร้างห้อง Multiplayer</button>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">

            <div class="input-group">
                <input type="text" id="room-code-input" placeholder="กรอกรหัสห้อง 4 หลัก..." style="text-transform: uppercase;">
                <button onclick="joinRoom()" class="btn btn-success">🔑 JOIN ROOM</button>
            </div>
        </div>

        <div id="room-info-section" class="card-box" style="display: none;">
            <h2>รหัสห้องของคุณ: <span id="display-room-code" style="color: #00ff88;">-</span></h2>
            <p>ให้เพื่อนสแกน QR Code หรือกรอกรหัสห้องเพื่อเข้าร่วม</p>
            <div id="qrcode-container" style="display: flex; justify-content: center; margin: 15px 0;"></div>
            <p id="waiting-status-text" style="color: #ffd700;">กำลังรอผู้เล่นคนอื่นเข้าร่วม...</p>
        </div>

        <div id="game-board-section" style="display: none;">
            <div id="cards-grid" class="cards-grid"></div>
        </div>
    </div>

    <!-- Modal ตอบคำถาม -->
    <div id="answer-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>🎵 ฟังเสียงแล้วทายว่าเป็นโน้ตอะไร?</h3>
            <button onclick="replayCurrentNote()" class="btn btn-warning" style="margin-bottom: 15px;">🔊 ฟังอีกครั้ง</button>
            
            <div class="note-buttons-grid">
                <button onclick="submitAnswer('C4')" class="btn btn-note">C (โด)</button>
                <button onclick="submitAnswer('D4')" class="btn btn-note">D (เร)</button>
                <button onclick="submitAnswer('E4')" class="btn btn-note">E (มี)</button>
                <button onclick="submitAnswer('F4')" class="btn btn-note">F (ฟา)</button>
                <button onclick="submitAnswer('G4')" class="btn btn-note">G (ซอล)</button>
                <button onclick="submitAnswer('A4')" class="btn btn-note">A (ลา)</button>
                <button onclick="submitAnswer('B4')" class="btn btn-note">B (ที)</button>
            </div>
        </div>
    </div>

    <!-- Modal การ์ดพิเศษ -->
    <div id="reward-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="reward-title">🎉 สุ่มได้การ์ดพิเศษ!</h2>
            <p id="reward-desc">-</p>
            <button onclick="confirmReward()" class="btn btn-primary">ตกลง</button>
        </div>
    </div>

    <!-- Modal จบเกม -->
    <div id="gameover-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>🏆 จบเกม!</h2>
            <h3 id="gameover-result-text">-</h3>
            <button onclick="restartGame()" class="btn btn-success">🔄 เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const socket = io({
            transports: ['websocket', 'polling']
        });

        let mySid = null;
        let currentRoomId = null;
        let currentTurnSid = null;
        let activeCardNote = null;
        let pendingRewardType = null;
        let currentAudio = null;

        socket.on('connect', () => {
            mySid = socket.id;
        });

        function playNoteSound(noteName) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(`/static/${noteName}.mp3`);
            currentAudio.play().catch(e => console.log("Audio play error:", e));
        }

        function updatePlayersUI(players, turnSid) {
            currentTurnSid = turnSid;
            const topBar = document.getElementById('top-bar-players');
            if (!topBar) return;
            
            topBar.innerHTML = '';
            players.forEach((p) => {
                const box = document.createElement('div');
                box.className = 'player-score-box' + (p.sid === turnSid ? ' active-turn' : '');
                box.innerHTML = `${p.name} : <b style="color: #ffd700;">${p.score}</b> คะแนน`;
                topBar.appendChild(box);
            });
        }

        function startSinglePlayer() {
            const playerName = document.getElementById('player-name-input').value.trim() || 'ผู้เล่น 1';
            socket.emit('create_room', { player_name: playerName, mode: 'single' });
        }

        function createRoom() {
            const playerName = document.getElementById('player-name-input').value.trim() || 'ผู้เล่น 1';
            socket.emit('create_room', { player_name: playerName, mode: 'multi' });
        }

        function joinRoom() {
            const roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();
            const playerName = document.getElementById('player-name-input').value.trim();
            
            if (!roomCode) {
                alert('กรุณากรอกรหัสห้อง');
                return;
            }
            socket.emit('join_room', { room_id: roomCode, player_name: playerName });
        }

        socket.on('room_created', (data) => {
            currentRoomId = data.room_id;
            updatePlayersUI(data.players, data.current_turn_sid);

            if (data.mode === 'single') {
                document.getElementById('lobby-section').style.display = 'none';
                document.getElementById('game-board-section').style.display = 'block';
                renderCards(data.cards);
            } else {
                document.getElementById('lobby-section').style.display = 'none';
                document.getElementById('room-info-section').style.display = 'block';
                document.getElementById('display-room-code').innerText = data.room_id;
                
                const qrContainer = document.getElementById('qrcode-container');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: window.location.href,
                    width: 150,
                    height: 150
                });
                renderCards(data.cards);
            }
        });

        socket.on('game_started', (data) => {
            currentRoomId = data.room_id;
            document.getElementById('lobby-section').style.display = 'none';
            document.getElementById('room-info-section').style.display = 'none';
            document.getElementById('game-board-section').style.display = 'block';

            updatePlayersUI(data.players, data.current_turn_sid);
            renderCards(data.cards);
        });

        function renderCards(cards) {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            cards.forEach((card) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'game-card' + (card.is_opened ? ' opened' : '');
                
                if (card.is_opened) {
                    cardEl.innerHTML = `<span style="font-size:24px;">${card.suit}</span><br><b>${card.note}</b>`;
                } else {
                    cardEl.innerHTML = `<span style="font-size:28px;">❓</span>`;
                    cardEl.onclick = () => onCardClick(card.id);
                }
                grid.appendChild(cardEl);
            });
        }

        function onCardClick(cardId) {
            if (currentTurnSid && mySid !== currentTurnSid) {
                alert('ยังไม่ถึงตาของคุณครับ! กรุณารอผู้เล่นคนอื่นเล่นก่อน');
                return;
            }
            socket.emit('pick_card', { card_id: cardId, room_id: currentRoomId });
        }

        socket.on('card_opened', (data) => {
            activeCardNote = data.card.note;
            playNoteSound(activeCardNote);
            document.getElementById('answer-modal').style.display = 'flex';
        });

        function replayCurrentNote() {
            if (activeCardNote) {
                playNoteSound(activeCardNote);
            }
        }

        function submitAnswer(guessNote) {
            document.getElementById('answer-modal').style.display = 'none';
            socket.emit('submit_answer', {
                guess: guessNote,
                room_id: currentRoomId
            });
        }

        socket.on('answer_result', (data) => {
            updatePlayersUI(data.players, data.next_turn_sid);
            
            const allCardEls = document.querySelectorAll('.game-card');
            if (allCardEls[data.removed_card_id]) {
                allCardEls[data.removed_card_id].classList.add('opened');
                allCardEls[data.removed_card_id].innerHTML = `<b>${data.correct_note}</b>`;
                allCardEls[data.removed_card_id].onclick = null;
            }

            if (data.is_correct && data.reward_card) {
                pendingRewardType = data.reward_card.type;
                document.getElementById('reward-title').innerText = data.reward_card.title;
                document.getElementById('reward-desc').innerText = data.reward_card.desc;
                document.getElementById('reward-modal').style.display = 'flex';
            } else if (!data.is_correct) {
                alert(`❌ ตอบผิด! โน้ตที่ถูกต้องคือ ${data.correct_note} (-20 คะแนน)`);
            }
        });

        function confirmReward() {
            document.getElementById('reward-modal').style.display = 'none';
            if (pendingRewardType) {
                socket.emit('select_reward', {
                    reward_type: pendingRewardType,
                    room_id: currentRoomId
                });
                pendingRewardType = null;
            }
        }

        socket.on('update_scores', (data) => {
            updatePlayersUI(data.players, data.next_turn_sid);
        });

        socket.on('game_over', (data) => {
            const info = data.winner_info;
            let msg = '';
            if (info.type === 'single') {
                msg = `คุณทำคะแนนได้ทั้งหมด ${info.score} คะแนน!`;
            } else if (info.type === 'win') {
                msg = `🎉 ผู้ชนะได้แก่: ${info.winner_name}`;
            } else {
                msg = `🤝 เกมนี้เสมอกัน!`;
            }
            document.getElementById('gameover-result-text').innerText = msg;
            document.getElementById('gameover-modal').style.display = 'flex';
        });

        function restartGame() {
            document.getElementById('gameover-modal').style.display = 'none';
            socket.emit('restart_game', { room_id: currentRoomId });
        }

        socket.on('game_restarted', (data) => {
            updatePlayersUI(data.players, data.current_turn_sid);
            renderCards(data.cards);
        });

        socket.on('error_msg', (data) => {
            alert(data.message);
        });
    </script>
</body>
</html>
